<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blogs | Jinlin Zheng</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/tag.jpg?v=1" />
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="site-title">Jinlin Zheng</a>
      <nav class="site-nav">
        <a href="index.html">About</a>
        <a href="research.html">Research</a>
        <a href="blogs.html" class="active">Blogs</a>
        <a href="games/index.html">Games</a>
        <a href="projects.html">Projects</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">☀️</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <h1 class="section-title">Blogs</h1>

    <!-- 博客列表由 JS 根据 blogPosts.js 渲染:左侧分组导航 + 右侧分组卡片 -->
    <div class="blog-layout">
      <aside class="blog-sidebar">
        <nav class="blog-group-nav" id="blogGroupNav" aria-label="博客分组导航"></nav>
      </aside>
      <div class="blog-groups" id="blogGroups"></div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 Jinlin Zheng. My Blog。
  </footer>

  <!-- 博客数据统一由 blogPosts.js 提供(新博客:blogs/posts/ 放文件 + blogPosts.js 追加一条) -->
  <script src="blogPosts.js?v=1"></script>
  <script>
    (function () {
      var groupsEl = document.getElementById('blogGroups');
      var navEl = document.getElementById('blogGroupNav');
      if (!groupsEl || !navEl) return;

      var base = 'blog-view.html?file=';
      function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      // 按固定顺序分组;blogPosts 本身按日期升序,遍历顺序即组内顺序
      var groups = {};
      blogCategoryOrder.forEach(function (cat, i) { groups[cat] = { index: i, items: [] }; });
      blogPosts.forEach(function (post) {
        var g = groups[post.category];
        if (!g) { // 容错:未识别分组归入"其他",排在最后
          if (!groups['其他']) groups['其他'] = { index: blogCategoryOrder.length, items: [] };
          g = groups['其他'];
        }
        g.items.push(post);
      });

      var names = Object.keys(groups).sort(function (a, b) { return groups[a].index - groups[b].index; });
      var sections = [];

      names.forEach(function (cat) {
        var g = groups[cat];
        if (!g.items.length) return; // 空分组不渲染

        var section = document.createElement('section');
        section.className = 'blog-group';
        section.id = 'group-' + g.index; // 数字 id,规避中文锚点编码问题

        var h2 = document.createElement('h2');
        h2.className = 'blog-group-title';
        h2.textContent = cat;
        var cnt = document.createElement('span');
        cnt.className = 'blog-group-count';
        cnt.textContent = '(' + g.items.length + ')';
        h2.appendChild(cnt);
        section.appendChild(h2);

        var ul = document.createElement('ul');
        ul.className = 'blog-list';
        g.items.forEach(function (post) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.className = 'blog-card';
          a.href = base + encodeURIComponent(post.file);
          a.innerHTML =
            '<h3 class="blog-title">' + escapeHtml(post.title) + '</h3>' +
            '<p class="blog-summary">' + escapeHtml(post.summary || '') + '</p>' +
            '<div class="blog-card-meta">' +
              '<span class="blog-date">' + escapeHtml(post.date) + '</span>' +
              '<span class="blog-cat">' + escapeHtml(post.category) + '</span>' +
            '</div>';
          li.appendChild(a);
          ul.appendChild(li);
        });
        section.appendChild(ul);
        groupsEl.appendChild(section);
        sections.push(section);

        var link = document.createElement('a');
        link.href = '#' + section.id;
        link.textContent = cat;
        link.setAttribute('data-target', section.id);
        navEl.appendChild(link);
      });

      // 滚动监听高亮当前分组(scroll-spy)
      function setActive(id) {
        var links = navEl.querySelectorAll('a');
        for (var i = 0; i < links.length; i++) {
          links[i].classList.toggle('active', links[i].getAttribute('data-target') === id);
        }
      }

      if ('IntersectionObserver' in window) {
        var activeId = sections.length ? sections[0].id : null;
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) activeId = entry.target.id;
          });
          setActive(activeId);
        }, { rootMargin: '-90px 0px -60% 0px' });
        sections.forEach(function (sec) { io.observe(sec); });
        // 页面底部兜底:最后一个分组较矮时也可能进不了观察带
        window.addEventListener('scroll', function () {
          if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) {
            setActive(sections[sections.length - 1].id);
          }
        }, { passive: true });
      } else {
        // 旧浏览器回退:节流滚动监听
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(function () {
            ticking = false;
            var line = 56 + 90; // 吸顶导航高度 + 余量
            var current = sections[0].id;
            for (var i = 0; i < sections.length; i++) {
              if (sections[i].getBoundingClientRect().top <= line) current = sections[i].id;
            }
            setActive(current);
          });
        }, { passive: true });
      }
    })();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
