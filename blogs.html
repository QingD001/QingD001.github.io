<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blogs | Jinlin Zheng</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/tag.jpg?v=1" />
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a href="index.html" class="site-title">Jinlin Zheng</a>
      <nav class="site-nav">
        <a href="index.html">About</a>
        <a href="research.html">Research</a>
        <a href="blogs.html" class="active">Blogs</a>
        <a href="games/index.html">Games</a>
        <a href="projects.html">Projects</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">☀️</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <h1 class="section-title">Blogs</h1>

    <!-- 博客列表由 JS 根据 blogPosts.js 渲染:侧栏切换分组,只显示当前分组的文章 -->
    <div class="blog-layout">
      <aside class="blog-sidebar">
        <nav class="blog-group-nav" id="blogGroupNav" aria-label="博客分组导航"></nav>
      </aside>
      <div class="blog-groups" id="blogGroups"></div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 Jinlin Zheng. My Blog。
  </footer>

  <!-- 博客数据统一由 blogPosts.js 提供(新博客:blogs/posts/ 放文件 + blogPosts.js 追加一条) -->
  <script src="blogPosts.js?v=1"></script>
  <script>
    (function () {
      var groupsEl = document.getElementById('blogGroups');
      var navEl = document.getElementById('blogGroupNav');
      if (!groupsEl || !navEl) return;

      var base = 'blog-view.html?file=';
      function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      // 按固定顺序分组;blogPosts 本身按日期升序,遍历顺序即组内顺序
      var groups = {};
      blogCategoryOrder.forEach(function (cat, i) { groups[cat] = { index: i, items: [] }; });
      blogPosts.forEach(function (post) {
        var g = groups[post.category];
        if (!g) { // 容错:未识别分组归入"其他",排在最后
          if (!groups['其他']) groups['其他'] = { index: blogCategoryOrder.length, items: [] };
          g = groups['其他'];
        }
        g.items.push(post);
      });

      var names = Object.keys(groups).sort(function (a, b) { return groups[a].index - groups[b].index; });
      var catByIndex = {}; // index -> 分组名,供 URL hash 定位

      // 侧栏:每个分组一个条目;条目下的文章链接只在本组展开,互不互通
      names.forEach(function (cat) {
        var g = groups[cat];
        if (!g.items.length) return; // 空分组不渲染

        catByIndex[g.index] = cat;

        var item = document.createElement('div');
        item.className = 'blog-group-nav-item';
        item.setAttribute('data-cat-index', g.index);

        var glink = document.createElement('a');
        glink.className = 'blog-group-link';
        glink.href = '#group-' + g.index; // 数字 id,规避中文锚点编码问题
        glink.textContent = cat + ' (' + g.items.length + ')';
        item.appendChild(glink);

        var sub = document.createElement('div');
        sub.className = 'blog-post-links';
        g.items.forEach(function (post) {
          var plink = document.createElement('a');
          plink.href = '#post-' + blogPosts.indexOf(post);
          plink.textContent = post.title;
          sub.appendChild(plink);
        });
        item.appendChild(sub);
        navEl.appendChild(item);
      });

      // 渲染当前分组的文章卡片(内容区只显示当前分组)
      function renderGroup(cat) {
        var g = groups[cat];
        groupsEl.innerHTML = '';

        var section = document.createElement('section');
        section.className = 'blog-group';

        var h2 = document.createElement('h2');
        h2.className = 'blog-group-title';
        h2.textContent = cat;
        var cnt = document.createElement('span');
        cnt.className = 'blog-group-count';
        cnt.textContent = '(' + g.items.length + ')';
        h2.appendChild(cnt);
        section.appendChild(h2);

        var ul = document.createElement('ul');
        ul.className = 'blog-list';
        g.items.forEach(function (post) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.className = 'blog-card';
          a.id = 'post-' + blogPosts.indexOf(post); // 供本组侧栏链接跳转
          a.href = base + encodeURIComponent(post.file);
          a.innerHTML =
            '<h3 class="blog-title">' + escapeHtml(post.title) + '</h3>' +
            '<p class="blog-summary">' + escapeHtml(post.summary || '') + '</p>' +
            '<div class="blog-card-meta">' +
              '<span class="blog-date">' + escapeHtml(post.date) + '</span>' +
              '<span class="blog-cat">' + escapeHtml(post.category) + '</span>' +
            '</div>';
          li.appendChild(a);
          ul.appendChild(li);
        });
        section.appendChild(ul);
        groupsEl.appendChild(section);

        // 侧栏:只有当前分组展开文章链接
        var items = navEl.querySelectorAll('.blog-group-nav-item');
        for (var i = 0; i < items.length; i++) {
          var isOpen = items[i].getAttribute('data-cat-index') === String(g.index);
          items[i].classList.toggle('open', isOpen);
          var l = items[i].querySelector('.blog-group-link');
          if (l) l.classList.toggle('active', isOpen);
        }
      }

      function groupFromHash() {
        var m = /^#group-(\d+)$/.exec(location.hash);
        return (m && catByIndex[m[1]]) ? catByIndex[m[1]] : null;
      }

      window.addEventListener('hashchange', function () {
        var cat = groupFromHash();
        if (cat) renderGroup(cat); // #post-N 等锚点不触发切换
      });

      renderGroup(groupFromHash() || names[0]);
    })();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
